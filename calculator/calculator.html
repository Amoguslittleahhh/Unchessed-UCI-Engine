<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Instruments TI-84 Scientific Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #222;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calc {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .display {
            background: #9ea73b;
            color: #000;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: right;
            border: 2px inset #777;
        }
        #screen {
            width: 350px;
            height: 60px;
            font-size: 32px;
            border: none;
            background: transparent;
            text-align: right;
            outline: none;
            line-height: 32px;
        }
        #history {
            height: 20px;
            font-size: 14px;
            color: #000;
            margin-bottom: 5px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 8px;
        }
        button {
            width: 60px;
            height: 40px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.05s;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.98);
            box-shadow: none;
        }
        .btn-num {
            background: #004f9a;
            color: #fff;
            font-weight: bold;
        }
        .btn-op {
            background: #b64822;
            color: #fff;
        }
        .btn-func {
            background: #dcdcdc;
            color: #000;
            font-size: 12px;
        }
        .btn-science {
            background: #dcdcdc;
            color: #000;
            font-size: 11px;
        }
        .btn-eq {
            background: #4a7a3a;
            color: #fff;
        }
        .btn-del {
            background: #a03030;
            color: #fff;
        }
        .btn-black {
            background: #000;
            color: #fff;
        }
        .btn-gold {
            background: #c48a4a;
            color: #fff;
        }
        .mode-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 10px;
            color: #888;
        }
        .mode-indicator {
            padding: 2px 8px;
            border-radius: 2px;
            background: #555;
            color: #fff;
        }
        /* Graphing Window Styles */
        .window-container {
            margin-top: 15px;
            background: #222;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .window-container.active {
            display: block;
        }
        .window-title {
            color: #fff;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .window-grid {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 8px;
            margin-bottom: 10px;
        }
        .window-input {
            display: flex;
            flex-direction: column;
        }
        .window-input label {
            color: #c48a4a;
            font-size: 11px;
            margin-bottom: 2px;
        }
        .window-input input {
            background: #000;
            color: #c48a4a;
            border: 1px solid #555;
            padding: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-align: center;
            border-radius: 2px;
        }
        .graph-area {
            margin-top: 15px;
            background: #000;
            border: 2px solid #555;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            cursor: crosshair;
        }
        .graph-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
        }
        .btn-graph {
            background: #4a7a3a;
            color: #fff;
            font-size: 11px;
            height: 32px;
        }
        .function-inputs {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }
        .function-input {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .function-label {
            color: #c48a4a;
            font-size: 12px;
            width: 30px;
        }
        .function-input input {
            flex: 1;
            background: #000;
            color: #fff;
            border: 1px solid #555;
            padding: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 2px;
        }
        .function-input input:focus {
            outline: none;
            border-color: #c48a4a;
        }
    </style>
</head>
<body>
    <div class="calc">
        <div class="display">
            <div id="history"></div>
            <input type="text" id="screen" readonly value="">
        </div>
        <div class="mode-info">
            <span id="angleMode" class="mode-indicator">DEG</span>
            <span id="functionMode" class="mode-indicator">NORMAL</span>
        </div>
        <div class="buttons">
            <!-- Row 1: Scientific functions -->
            <button class="btn-science" onclick="toggleAngleMode()">MODE</button>
            <button class="btn-science" onclick="func('sin(')">sin</button>
            <button class="btn-science" onclick="func('cos(')">cos</button>
            <button class="btn-science" onclick="func('tan(')">tan</button>
            <button class="btn-science" onclick="func('log(')">log</button>

            <!-- Row 2 -->
            <button class="btn-science" onclick="func('1/(')">x<sup>-1</sup></button>
            <button class="btn-science" onclick="func('sin<sup>-1</sup>(')">sin<sup>-1</sup></button>
            <button class="btn-science" onclick="func('cos<sup>-1</sup>(')">cos<sup>-1</sup></button>
            <button class="btn-science" onclick="func('tan<sup>-1</sup>(')">tan<sup>-1</sup></button>
            <button class="btn-science" onclick="func('ln(')">ln</button>

            <!-- Row 3 -->
            <button class="btn-science" onclick="func('^')">^</button>
            <button class="btn-science" onclick="func('sinh(')">sinh</button>
            <button class="btn-science" onclick="func('cosh(')">cosh</button>
            <button class="btn-science" onclick="func('tanh(')">tanh</button>
            <button class="btn-science" onclick="func('e<sup>x</sup>(')">e<sup>x</sup></button>

            <!-- Row 4 -->
            <button class="btn-science" onclick="func('sqrt(')">√</button>
            <button class="btn-science" onclick="func('sq(')">x²</button>
            <button class="btn-science" onclick="func('x<sup>3</sup>(')">x<sup>3</sup></button>
            <button class="btn-science" onclick="func('10<sup>x</sup>(')">10<sup>x</sup></button>
            <button class="btn-science" onclick="func('e<sup>x</sup>(')">e<sup>x</sup></button>

            <!-- Row 5 -->
            <button class="btn-science" onclick="func('ans(')">ANS</button>
            <button class="btn-science" onclick="func('rand')">rand</button>
            <button class="btn-science" onclick="func('randInt(')">randInt(</button>
            <button class="btn-science" onclick="func('randNorm(')">randNorm(</button>
            <button class="btn-science" onclick="func('π')">π</button>

            <!-- Row 6: Numbers and ops -->
            <button class="btn-num" onclick="num('7')">7</button>
            <button class="btn-num" onclick="num('8')">8</button>
            <button class="btn-num" onclick="num('9')">9</button>
            <button class="btn-black" onclick="func('MC')">MC</button>
            <button class="btn-black" onclick="func('MR')">MR</button>

            <!-- Row 7 -->
            <button class="btn-num" onclick="num('4')">4</button>
            <button class="btn-num" onclick="num('5')">5</button>
            <button class="btn-num" onclick="num('6')">6</button>
            <button class="btn-black" onclick="func('M+')">M+</button>
            <button class="btn-black" onclick="func('M-')">M-</button>

            <!-- Row 8 -->
            <button class="btn-num" onclick="num('1')">1</button>
            <button class="btn-num" onclick="num('2')">2</button>
            <button class="btn-num" onclick="num('3')">3</button>
            <button class="btn-op" onclick="op('*')">×</button>
            <button class="btn-op" onclick="op('/')">÷</button>

            <!-- Row 9 -->
            <button class="btn-num" onclick="num('0')">0</button>
            <button class="btn-num" onclick="num('.')">.</button>
            <button class="btn-num" onclick="func('(')">(</button>
            <button class="btn-num" onclick="func(')')">)</button>
            <button class="btn-eq" onclick="calc()">=</button>

            <!-- Row 10: Extra functions and del -->
            <button class="btn-science" onclick="func('abs(')">abs</button>
            <button class="btn-science" onclick="func('int(')">int</button>
            <button class="btn-science" onclick="func('frac(')">frac</button>
            <button class="btn-del" onclick="del()">DEL</button>
            <button class="btn-op" onclick="op('+')">+</button>

            <!-- Row 11: Additional functions -->
            <button class="btn-science" onclick="func('nPr')">nPr</button>
            <button class="btn-science" onclick="func('nCr')">nCr</button>
            <button class="btn-science" onclick="func('!')">n!</button>
            <button class="btn-op" onclick="op('-')">-</button>
            <button class="btn-op" onclick="op('%')">%</button>

            <!-- Row 12: Graphing functions -->
            <button class="btn-science" onclick="toggleGraphMode()">GRAPH</button>
            <button class="btn-science" onclick="func('Y=')">Y=</button>
            <button class="btn-science" onclick="func('ZOOM')">ZOOM</button>
            <button class="btn-science" onclick="func('TRACE')">TRACE</button>
            <button class="btn-science" onclick="func('TABLE')">TABLE</button>
        </div>

        <!-- Graphing Window -->
        <div id="graphWindow" class="window-container">
            <div class="window-title">WINDOW</div>
            <div class="window-grid">
                <div class="window-input">
                    <label>Xmin</label>
                    <input type="number" id="xMin" value="-10">
                </div>
                <div class="window-input">
                    <label>Xmax</label>
                    <input type="number" id="xMax" value="10">
                </div>
                <div class="window-input">
                    <label>Xscl</label>
                    <input type="number" id="xScl" value="1">
                </div>
                <div class="window-input">
                    <label></label>
                </div>
                <div class="window-input">
                    <label>Ymin</label>
                    <input type="number" id="yMin" value="-10">
                </div>
                <div class="window-input">
                    <label>Ymax</label>
                    <input type="number" id="yMax" value="10">
                </div>
                <div class="window-input">
                    <label>Yscl</label>
                    <input type="number" id="yScl" value="1">
                </div>
                <div class="window-input">
                    <label></label>
                </div>
            </div>
            <div class="function-inputs">
                <div class="function-input">
                    <span class="function-label">Y1=</span>
                    <input type="text" id="y1Input" placeholder="x^2" oninput="updatePreview()">
                </div>
                <div class="function-input">
                    <span class="function-label">Y2=</span>
                    <input type="text" id="y2Input" placeholder="sin(x)" oninput="updatePreview()">
                </div>
                <div class="function-input">
                    <span class="function-label">Y3=</span>
                    <input type="text" id="y3Input" placeholder="cos(x)" oninput="updatePreview()">
                </div>
            </div>
            <div class="graph-area">
                <canvas id="graphCanvas" width="400" height="300"></canvas>
            </div>
            <div class="graph-controls">
                <button class="btn-graph" onclick="drawGraph()">GRAPH</button>
                <button class="btn-graph" onclick="zoomFit()">ZOOM FIT</button>
                <button class="btn-graph" onclick="zoomStandard()">ZOOM STD</button>
                <button class="btn-graph" onclick="zoomOut()">ZOOM OUT</button>
                <button class="btn-graph" onclick="zoomIn()">ZOOM IN</button>
                <button class="btn-graph" onclick="toggleGraphMode()">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        let current = '';
        let historyStack = [];
        let ans = 0;
        let memory = 0;
        let angleMode = 'DEG';
        let isGraphMode = false;

        function num(n) {
            current += n;
            update();
        }

        function op(o) {
            current += o;
            update();
        }

        function func(f) {
            if (f === 'MC') { memory = 0; return; }
            if (f === 'MR') { current += memory.toString(); update(); return; }
            if (f === 'M+') {
                try { calculateExpression(); memory = parseFloat(eval(current)); current = ''; }
                catch { }
                update();
                return;
            }
            if (f === 'M-') {
                try { calculateExpression(); memory -= parseFloat(eval(current)); current = ''; }
                catch { }
                update();
                return;
            }
            if (f === 'sin<sup>-1</sup>(') {
                current += 'asin(';
                update();
                return;
            }
            if (f === 'cos<sup>-1</sup>(') {
                current += 'acos(';
                update();
                return;
            }
            if (f === 'tan<sup>-1</sup>(') {
                current += 'atan(';
                update();
                return;
            }
            if (f === 'e<sup>x</sup>(') {
                current += 'Math.exp(';
                update();
                return;
            }
            if (f === '10<sup>x</sup>(') {
                current += 'Math.pow(10, ';
                update();
                return;
            }
            if (f === 'x²') {
                current += 'Math.pow(';
                update();
                return;
            }
            if (f === 'x<sup>3</sup>(') {
                current += 'Math.pow(';
                update();
                return;
            }
            if (f === 'nPr') {
                current += 'nPr(';
                update();
                return;
            }
            if (f === 'nCr') {
                current += 'nCr(';
                update();
                return;
            }
            if (f === 'n!') {
                current += 'factorial(';
                update();
                return;
            }
            if (f === 'Y=') {
                toggleGraphMode();
                document.getElementById('y1Input').focus();
                return;
            }
            if (f === 'ZOOM') {
                alert('ZOOM options:\n1: ZStandard - Standard -10 to 10 window\n2: ZFit - Fit to data\n3: ZOut - Zoom out\n4: ZIn - Zoom in');
                return;
            }
            if (f === 'TRACE') {
                alert('TRACE mode: Use arrow keys to trace graph (not available in this version)');
                return;
            }
            if (f === 'TABLE') {
                alert('TABLE mode: Not available in this version. Use graph instead.');
                return;
            }

            current += f;
            update();
        }

        function del() {
            current = current.slice(0, -1);
            update();
        }

        function update() {
            document.getElementById('screen').value = current;
        }

        function toggleAngleMode() {
            angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
            document.getElementById('angleMode').textContent = angleMode;
            update();
        }

        function toggleGraphMode() {
            isGraphMode = !isGraphMode;
            const graphWindow = document.getElementById('graphWindow');
            if (isGraphMode) {
                graphWindow.classList.add('active');
                drawGraph();
            } else {
                graphWindow.classList.remove('active');
            }
        }

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function nPr(n, r) {
            return factorial(n) / factorial(n - r);
        }

        function nCr(n, r) {
            return factorial(n) / (factorial(r) * factorial(n - r));
        }

        function degreesToRadians(deg) {
            return deg * Math.PI / 180;
        }

        function radiansToDegrees(rad) {
            return rad * 180 / Math.PI;
        }

        function trigSin(x) {
            if (angleMode === 'DEG') x = degreesToRadians(x);
            return Math.sin(x);
        }

        function trigCos(x) {
            if (angleMode === 'DEG') x = degreesToRadians(x);
            return Math.cos(x);
        }

        function trigTan(x) {
            if (angleMode === 'DEG') x = degreesToRadians(x);
            return Math.tan(x);
        }

        function trigAsin(x) {
            let result = Math.asin(x);
            if (angleMode === 'DEG') result = radiansToDegrees(result);
            return result;
        }

        function trigAcos(x) {
            let result = Math.acos(x);
            if (angleMode === 'DEG') result = radiansToDegrees(result);
            return result;
        }

        function trigAtan(x) {
            let result = Math.atan(x);
            if (angleMode === 'DEG') result = radiansToDegrees(result);
            return result;
        }

        function fractionPart(x) {
            return x - Math.floor(x);
        }

        function calculateExpression() {
            try {
                let expr = current
                    .replace(/sin\(/g, 'trigSin(')
                    .replace(/cos\(/g, 'trigCos(')
                    .replace(/tan\(/g, 'trigTan(')
                    .replace(/asin\(/g, 'trigAsin(')
                    .replace(/acos\(/g, 'trigAcos(')
                    .replace(/atan\(/g, 'trigAtan(')
                    .replace(/sinh\(/g, 'Math.sinh(')
                    .replace(/cosh\(/g, 'Math.cosh(')
                    .replace(/tanh\(/g, 'Math.tanh(')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/ln\(/g, 'Math.log(')
                    .replace(/sqrt\(/g, 'Math.sqrt(')
                    .replace(/abs\(/g, 'Math.abs(')
                    .replace(/int\(/g, 'Math.floor(')
                    .replace(/frac\(/g, 'fractionPart(')
                    .replace(/π/g, 'Math.PI')
                    .replace(/\bans\(/g, 'ans')
                    .replace(/\bans\b/g, 'ans')
                    .replace(/\brand\b/g, 'Math.random()')
                    .replace(/nPr\(/g, 'function_call_nPr(')
                    .replace(/nCr\(/g, 'function_call_nCr(')
                    .replace(/factorial\(/g, 'function_call_factorial(')
                    .replace(/Math\.exp\(/g, 'function_call_exp(')
                    .replace(/Math\.pow\(/g, 'function_call_pow(');

                expr = expr.replace(/\^/g, '**');
                expr = expr.replace(/(\d+)%/g, '($1/100)');
                expr = expr.replace(/(\d+)!/g, 'factorial($1)');

                expr = expr.replace(/function_call_nPr\(([^,]+),\s*([^)]+)\)/g, 'nPr($1, $2)');
                expr = expr.replace(/function_call_nCr\(([^,]+),\s*([^)]+)\)/g, 'nCr($1, $2)');
                expr = expr.replace(/function_call_factorial\(([^)]+)\)/g, 'factorial($1)');
                expr = expr.replace(/function_call_exp\(([^)]+)\)/g, 'Math.exp($1)');
                expr = expr.replace(/function_call_pow\(([^,]+),\s*([^)]+)\)/g, 'Math.pow($1, $2)');

                historyStack.push(current);
                const result = eval(expr);
                ans = result;
                current = result.toString();
                update();

                document.getElementById('history').textContent = current + '  (Ans=' + ans.toFixed(6).replace(/\.?0+$/, '') + ')';
            } catch (e) {
                current = 'Error';
                update();
                document.getElementById('history').textContent = 'Error: ' + e.message;
            }
        }

        function calc() {
            calculateExpression();
        }

        // Graphing Functions
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');

        function clearCanvas() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawGrid(xMin, xMax, yMin, yMax) {
            const width = canvas.width;
            const height = canvas.height;

            // Draw axes
            const xScale = width / (xMax - xMin);
            const yScale = height / (yMax - yMin);

            const xOrigin = (0 - xMin) * xScale;
            const yOrigin = height - (0 - yMin) * yScale;

            // Draw grid lines
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;

            // Vertical lines
            const xStep = Math.pow(10, Math.floor(Math.log10(Math.abs(xMax - xMin) / 5)));
            for (let x = Math.ceil(xMin / xStep) * xStep; x <= xMax; x += xStep) {
                const xPos = (x - xMin) * xScale;
                ctx.beginPath();
                ctx.moveTo(xPos, 0);
                ctx.lineTo(xPos, height);
                ctx.stroke();
            }

            // Horizontal lines
            const yStep = Math.pow(10, Math.floor(Math.log10(Math.abs(yMax - yMin) / 5)));
            for (let y = Math.ceil(yMin / yStep) * yStep; y <= yMax; y += yStep) {
                const yPos = height - (y - yMin) * yScale;
                ctx.beginPath();
                ctx.moveTo(0, yPos);
                ctx.lineTo(width, yPos);
                ctx.stroke();
            }

            // Draw axes
            ctx.strokeStyle = '#c48a4a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, yOrigin);
            ctx.lineTo(width, yOrigin);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(xOrigin, 0);
            ctx.lineTo(xOrigin, height);
            ctx.stroke();

            // Draw labels
            ctx.fillStyle = '#c48a4a';
            ctx.font = '10px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            for (let x = Math.ceil(xMin / xStep) * xStep; x <= xMax; x += xStep) {
                const xPos = (x - xMin) * xScale;
                if (Math.abs(x) > 0.0001) ctx.fillText(x.toFixed(0), xPos, yOrigin + 2);
            }

            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (let y = Math.ceil(yMin / yStep) * yStep; y <= yMax; y += yStep) {
                const yPos = height - (y - yMin) * yScale;
                if (Math.abs(y) > 0.0001) ctx.fillText(y.toFixed(0), xOrigin - 3, yPos);
            }

            ctx.fillText('0', xOrigin - 5, yOrigin + 2);
            ctx.fillText('x', width - 10, yOrigin + 5);
            ctx.fillText('y', xOrigin + 5, 10);
        }

        function parseExpression(expr) {
            let jsExpr = expr
                .replace(/\^/g, '**')
                .replace(/sin\(/g, 'trigSin(')
                .replace(/cos\(/g, 'trigCos(')
                .replace(/tan\(/g, 'trigTan(')
                .replace(/asin\(/g, 'trigAsin(')
                .replace(/acos\(/g, 'trigAcos(')
                .replace(/atan\(/g, 'trigAtan(')
                .replace(/sinh\(/g, 'Math.sinh(')
                .replace(/cosh\(/g, 'Math.cosh(')
                .replace(/tanh\(/g, 'Math.tanh(')
                .replace(/log\(/g, 'Math.log10(')
                .replace(/ln\(/g, 'Math.log(')
                .replace(/sqrt\(/g, 'Math.sqrt(')
                .replace(/abs\(/g, 'Math.abs(')
                .replace(/π/g, 'Math.PI')
                .replace(/\brand/g, 'Math.random()')
                .replace(/e(?![a-z])/g, 'Math.E');

            return jsExpr;
        }

        function evaluateAt(expr, x) {
            try {
                const jsExpr = parseExpression(expr);
                const result = eval(jsExpr);
                return isNaN(result) || !isFinite(result) ? null : result;
            } catch {
                return null;
            }
        }

        function drawFunction(expr, color, xMin, xMax, yMin, yMax) {
            const width = canvas.width;
            const height = canvas.height;
            const xScale = width / (xMax - xMin);
            const yScale = height / (yMax - yMin);

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();

            let moved = false;

            for (let x = xMin; x <= xMax; x += (xMax - xMin) / width * 2) {
                const y = evaluateAt(expr, x);
                if (y === null || isNaN(y) || !isFinite(y)) {
                    moved = false;
                    continue;
                }

                const xPos = (x - xMin) * xScale;
                const yPos = height - (y - yMin) * yScale;

                if (yPos < -100 || yPos > height + 100) {
                    moved = false;
                    continue;
                }

                if (!moved) {
                    ctx.moveTo(xPos, yPos);
                    moved = true;
                } else {
                    ctx.lineTo(xPos, yPos);
                }
            }
            ctx.stroke();
        }

        function drawGraph() {
            const xMin = parseFloat(document.getElementById('xMin').value) || -10;
            const xMax = parseFloat(document.getElementById('xMax').value) || 10;
            const yMin = parseFloat(document.getElementById('yMin').value) || -10;
            const yMax = parseFloat(document.getElementById('yMax').value) || 10;

            clearCanvas();
            drawGrid(xMin, xMax, yMin, yMax);

            const y1 = document.getElementById('y1Input').value;
            const y2 = document.getElementById('y2Input').value;
            const y3 = document.getElementById('y3Input').value;

            if (y1.trim()) drawFunction(y1, '#4a7a3a', xMin, xMax, yMin, yMax);
            if (y2.trim()) drawFunction(y2, '#c48a4a', xMin, xMax, yMin, yMax);
            if (y3.trim()) drawFunction(y3, '#004f9a', xMin, xMax, yMin, yMax);
        }

        function updatePreview() {
            if (isGraphMode) {
                drawGraph();
            }
        }

        function zoomStandard() {
            document.getElementById('xMin').value = -10;
            document.getElementById('xMax').value = 10;
            document.getElementById('yMin').value = -10;
            document.getElementById('yMax').value = 10;
            document.getElementById('xScl').value = 1;
            document.getElementById('yScl').value = 1;
            drawGraph();
        }

        function zoomFit() {
            drawGraph();
        }

        function zoomOut() {
            const xMin = parseFloat(document.getElementById('xMin').value) || -10;
            const xMax = parseFloat(document.getElementById('xMax').value) || 10;
            const yMin = parseFloat(document.getElementById('yMin').value) || -10;
            const yMax = parseFloat(document.getElementById('yMax').value) || 10;

            const rangeX = xMax - xMin;
            const rangeY = yMax - yMin;

            document.getElementById('xMin').value = xMin - rangeX / 2;
            document.getElementById('xMax').value = xMax + rangeX / 2;
            document.getElementById('yMin').value = yMin - rangeY / 2;
            document.getElementById('yMax').value = yMax + rangeY / 2;
            drawGraph();
        }

        function zoomIn() {
            const xMin = parseFloat(document.getElementById('xMin').value) || -10;
            const xMax = parseFloat(document.getElementById('xMax').value) || 10;
            const yMin = parseFloat(document.getElementById('yMin').value) || -10;
            const yMax = parseFloat(document.getElementById('yMax').value) || 10;

            const rangeX = xMax - xMin;
            const rangeY = yMax - yMin;

            document.getElementById('xMin').value = xMin + rangeX / 4;
            document.getElementById('xMax').value = xMax - rangeX / 4;
            document.getElementById('yMin').value = yMin + rangeY / 4;
            document.getElementById('yMax').value = yMax - rangeY / 4;
            drawGraph();
        }

        // Initialize
        update();
    </script>
</body>
</html>
